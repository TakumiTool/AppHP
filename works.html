<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tt-sugar 作成物紹介</title>
    <style>
        :root {
            --primary-color: #0066cc;
            --text-color: #333333;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #e9ecef;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 2rem 1rem;
            text-align: center;
        }

        header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 1.8rem;
        }

        header p {
            margin: 0;
            color: #666;
            font-size: 0.95rem;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            gap: 1rem;
        }

        .work-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
        }

        .work-card h2 {
            margin: 0 0 0.3rem 0;
            font-size: 1.3rem;
        }

        .work-card p {
            margin: 0 0 1rem 0;
            color: #666;
            font-size: 0.95rem;
        }

        .download-btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: #ffffff;
            text-decoration: none;
            padding: 0.5rem 1.2rem;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .download-btn:hover {
            opacity: 0.85;
        }

        .back-link {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            padding: 2rem 1rem;
            color: #666;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>作成物紹介</h1>
        <p>作成したファイルをダウンロードできます</p>
    </header>

    <div class="container">
        <div class="work-card">
            <h2>テストファイル</h2>
            <p>ダウンロードリンクの動作確認用テキストファイルです。</p>
            <a class="download-btn" href="works/test.txt" download>test.txt をダウンロード</a>
        </div>

        <a class="back-link" href="index.html">← トップページへ戻る</a>
    </div>

    <footer>
        <p>&copy; 2026 tt-sugar. All Rights Reserved.</p>
    </footer>

</body>
</html>
