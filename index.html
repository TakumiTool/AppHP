<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TakumiTool</title>
    <meta name="description" content="TakumiTool ― ちょっと巧みに、ずっとラクに。施工現場の作業を効率化する iOS アプリのサポートサイトです。">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/site.css">
    <script>document.documentElement.classList.add('js');</script>
    <style>
        /* トップページだけの見た目 */
        html { scroll-padding-top: 72px; }
        .hero { position: relative; overflow: hidden; background: linear-gradient(180deg, var(--paper) 0%, #e3edf7 100%); }
        .hero .wrap { position: relative; z-index: 1; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 40px; align-items: center; padding-top: 80px; padding-bottom: 150px; }
        h1 { margin: 0; font-size: clamp(2.3rem, 5vw, 4.2rem); line-height: 1.3; font-weight: 900; letter-spacing: -0.01em; }
        h1 .nb { display: inline-block; }
        .hero .en { margin: 18px 0 0; color: var(--muted); font-size: 1.05rem; letter-spacing: 0.04em; }
        .hero-icon {
            justify-self: center;
            width: min(100%, 320px); height: auto; aspect-ratio: 1 / 1;
            border-radius: 22%;
            box-shadow: 0 30px 60px rgba(23, 63, 107, 0.3);
            animation: bob 6s ease-in-out infinite;
        }
        @keyframes bob { 0%, 100% { translate: 0 0; rotate: -4deg; } 50% { translate: 0 -14px; rotate: -2deg; } }

        .apps { background: var(--theme); padding: 40px 0 110px; color: #fff; }
        .apps .section-head { color: #fff; }
        .apps .section-head .num { color: var(--highlight); }
        .addins { padding: 110px 0 0; }
        .contact { padding: 110px 0 40px; }

        @media (max-width: 820px) {
            .hero .wrap { grid-template-columns: 1fr; padding-top: 44px; padding-bottom: 120px; gap: 36px; }
            .hero-icon { width: 200px; order: -1; }
        }
    </style>
</head>
<body id="top" data-base="">

    <header class="topbar">
        <div class="wrap">
            <a class="brand" href="#top"><img src="assets/favicon.png" alt="" width="36" height="36">TakumiTool</a>
            <nav>
                <a class="nav-text" href="#apps">アプリ</a>
                <a class="nav-text" href="#addins">拡張アドイン</a>
                <a class="nav-text" href="#contact">お問い合わせ</a>
                <a href="https://x.com/TakumiTool" target="_blank" rel="noopener" aria-label="X（旧Twitter）">
                    <svg class="x-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                </a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="wrap">
            <div class="reveal">
                <h1><span class="nb">ちょっと巧みに、</span><br><span class="nb">ずっとラクに。</span></h1>
                <p class="en">A little smarter, a lot easier.</p>
            </div>
            <img class="hero-icon" src="assets/icon-512.png" alt="TakumiTool のアイコン" width="320" height="320">
        </div>
        <svg class="waves waves-to-theme" viewBox="0 24 150 28" preserveAspectRatio="none" aria-hidden="true">
            <defs><path id="wave" d="M-160 44c30 0 58-18 88-18s58 18 88 18 58-18 88-18 58 18 88 18v44h-352z"/></defs>
            <use href="#wave" x="48" y="0"/>
            <use href="#wave" x="48" y="3"/>
            <use href="#wave" x="48" y="5"/>
            <use href="#wave" x="48" y="7"/>
        </svg>
    </section>

    <section class="apps" id="apps">
        <div class="wrap">
            <h2 class="section-head reveal"><span class="num">APPS</span>アプリ</h2>
            <div class="app-grid" id="app-grid"></div>
            <noscript><p>アプリ一覧の表示には JavaScript を有効にしてください。</p></noscript>
        </div>
    </section>

    <!-- <section class="addins" id="addins">
        <div class="wrap">
            <h2 class="section-head reveal"><span class="num">ADD-INS</span>拡張アドイン</h2>
            <div class="addin-grid" id="addin-grid"></div>
            <p class="more"><a href="addins/">拡張アドインの一覧を見る →</a></p>
        </div>
    </section> -->

    <section class="contact" id="contact">
        <div class="wrap reveal">
            <h2 class="section-head"><span class="num">CONTACT</span>お問い合わせ</h2>
            <div class="rows">
                <a class="row" href="https://x.com/TakumiTool" target="_blank" rel="noopener">
                    <h3>X でフォロー</h3>
                    <p>最新情報を発信しています<strong>@TakumiTool</strong></p>
                    <span class="arrow">→</span>
                </a>
                <a class="row" href="mailto:sg.tatsuya@gmail.com">
                    <h3>メール</h3>
                    <p>不具合のご報告・ご質問・ご要望はこちら<strong>sg.tatsuya@gmail.com</strong></p>
                    <span class="arrow">→</span>
                </a>
            </div>
        </div>
    </section>

    <footer>
        <div class="wrap">
            <a class="brand" href="#top"><img src="assets/favicon.png" alt="" width="36" height="36">TakumiTool</a>
            <div class="foot-right">
                <a href="https://x.com/TakumiTool" target="_blank" rel="noopener" aria-label="X（旧Twitter）">
                    <svg class="x-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                </a>
                <p>&copy; 2026 TakumiTool. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="assets/site.js"></script>

</body>
</html>
